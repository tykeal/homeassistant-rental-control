---
# Grype ignore rules for packages inherited from Home Assistant.
#
# Every package listed below reaches our SBOM only as a transitive
# dependency of Home Assistant. Home Assistant itself is declared
# solely under the "dev" and "test" optional dependency groups in
# pyproject.toml; it is never shipped to users. People running this
# integration get Home Assistant from their own installation, so
# none of these packages are part of what we distribute.
#
# Home Assistant pins each of these to an exact version, which means
# we cannot upgrade them independently. Dependabot security updates
# for them fail outright as unresolvable, because the requested
# version directly contradicts Home Assistant's pin. The only real
# remedy is for Home Assistant upstream to bump its own pins, which
# we then pick up automatically.
#
# These rules are deliberately written without a "version" and
# without a "vulnerability" key, so they match every version of the
# package and every advisory against it. The previous configuration
# pinned each ignore to a specific CVE at a specific version. Those
# entries silently stopped matching anything the moment Home
# Assistant bumped a pin, which broke CI and forced a hand rewrite
# of this file on every upstream bump.
#
# Revisit this file if any of these packages ever becomes a direct
# runtime dependency of this integration. At that point we would
# control its version ourselves and should audit it properly
# rather than blanket-ignoring it.
ignore:
  # Imaging library pulled in by Home Assistant's core
  # requirements; pinned exactly by Home Assistant.
  - package:
      name: pillow
      type: python

  # Python package installer vendored into Home Assistant's
  # requirements; pinned exactly by Home Assistant.
  - package:
      name: uv
      type: python

  # JWT implementation used by Home Assistant's auth stack;
  # pinned exactly by Home Assistant.
  - package:
      name: PyJWT
      type: python

  # Cryptographic primitives used throughout Home Assistant;
  # pinned exactly by Home Assistant.
  - package:
      name: cryptography
      type: python
