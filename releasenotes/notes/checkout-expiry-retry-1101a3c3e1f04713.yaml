---
fixes:
  - |
    Manual checkout now completes even when Rental Control cannot confirm
    the early lock-code expiry update. A persistent notification reports
    the unconfirmed update. Retries run after 5 minutes, then every 15 minutes
    while the original reservation can be safely identified, stopping at its
    original end time or when authoritative data confirms it is gone. Missing
    slot assignments or unavailable calendar data delay dispatch rather than
    routing an update to a replacement reservation. Pending retries are
    restored after a Home Assistant restart.

    Verified and legacy Keymaster updates wait for the expected datetime
    value to be read back before clearing the notification. A successful
    datetime-service acknowledgment without matching state remains pending
    and is retried. In legacy mode, manual checkout may wait up to five
    seconds for datetime state read-back before transitioning to checked out.
