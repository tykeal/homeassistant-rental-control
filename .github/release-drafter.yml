---
# SPDX-FileCopyrightText: 2021 Andrew Grimberg <tykeal@bardicgrove.org>
# SPDX-License-Identifier: Apache-2.0

name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
sort-direction: ascending
categories:
  - title: "💥 Breaking Change 💥"
    semver-increment: major
    when:
      label: "breaking-change"
  - title: "✨ New Features ✨"
    semver-increment: minor
    when:
      labels:
        - "enhancement"
        - "feature"
  - title: "🐛 Bug Fixes 🐛"
    semver-increment: patch
    when:
      label: "bug"
  - title: "⚡ Performance ⚡"
    semver-increment: patch
    when:
      label: "performance"
  - title: "🔧 Maintenance 🔧"
    collapse-after: 3
    semver-increment: patch
    when:
      labels:
        - "chore"
        - "documentation"
        - "dependencies"
        - "github_actions"
        - "refactor"
        - "build"
        - "revert"
  - title: "🎓 Code Quality 🎓"
    collapse-after: 3
    semver-increment: patch
    when:
      labels:
        - "code-quality"
        - "CI"
  # Fallback: anything not matched above still resolves to a patch bump,
  # replacing the deprecated top-level 'version-resolver.default'.
  - type: version-resolver
    semver-increment: patch
autolabeler:
  - label: "breaking-change"
    title:
      - '/^[a-z]+(\([^)]+\))?!:/i'
  - label: "feature"
    title:
      - '/^feat(\([^)]+\))?:/i'
  - label: "bug"
    title:
      - '/^fix(\([^)]+\))?:/i'
  - label: "refactor"
    title:
      - '/^refactor(\([^)]+\))?:/i'
  # 'test:' and 'style:' share the 'code-quality' label; this repository
  # has no 'test' or 'style' label and adding one would be redundant.
  - label: "code-quality"
    title:
      - '/^test(\([^)]+\))?:/i'
      - '/^style(\([^)]+\))?:/i'
  - label: "CI"
    title:
      - '/^ci(\([^)]+\))?:/i'
  - label: "chore"
    title:
      - '/^chore(\([^)]+\))?:/i'
  - label: "documentation"
    title:
      - '/^docs(\([^)]+\))?:/i'
  - label: "performance"
    title:
      - '/^perf(\([^)]+\))?:/i'
  - label: "revert"
    title:
      - '/^revert(\([^)]+\))?:/i'
  - label: "build"
    title:
      - '/^build(\([^)]+\))?:/i'
# yamllint disable rule:line-length
template: |
  [![Downloads for this release](https://img.shields.io/github/downloads/$OWNER/$REPOSITORY/v$RESOLVED_VERSION/total.svg)](https://github.com/$OWNER/$REPOSITORY/releases/v$RESOLVED_VERSION)

  $CHANGES

  ## Links
  - [Submit bugs/feature requests](https://github.com/$OWNER/$REPOSITORY/issues)
