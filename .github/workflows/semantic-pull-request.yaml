name: 'Semantic Pull Request 🛠️'

# yamllint disable-line rule:truthy
on:
  # Not supported when workflow contains: amannn/action-semantic-pull-request
  # workflow_dispatch:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  semantic-pull-request:
    name: "Semantic Pull Request"
    # Delegate to the shared reusable workflow, which tolerates Dependabot's
    # truncated single-commit subjects for long dependency names that
    # otherwise trip validateSingleCommitMatchesPrTitle.
    #
    # Migrated from lfit/releng-reusable-workflows, which is retiring.
    # The reusable's job is still named 'Semantic Pull Request', so the
    # check run stays 'Semantic Pull Request / Semantic Pull Request'
    # and the ruleset naming it keeps matching.
    #
    # Every input is optional and defaults to the organisation's
    # Conventional Commits policy, so this caller passes none. See
    # generic-workflows' docs/semantic-pull-request.md.
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/generic-workflows/.github/workflows/semantic-pull-request.yaml@04672a980550ff9bd89d24bacd39fb03e25b0b0b  # v0.6.1
    permissions:
      contents: read
      pull-requests: read  # Gate step queries the PR API (avoids 403)
