name: 'Release Drafter'

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update_release_draft:
    name: 'Update Release Draft'
    permissions:
      contents: write  # Creates and rewrites the draft GitHub release
      pull-requests: read  # Draft notes are built from merged PRs
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: 'audit'

      # Full history and tags let reno find the notes added since the
      # latest release tag.
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No cache: this job holds contents: write.
      # yamllint disable-line rule:line-length
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          enable-cache: false

      # The draft body is rebuilt on every push, so release notes live in
      # releasenotes/notes/ and are rendered into the config each time.
      - name: 'Render release notes into the Release Drafter config'
        run: |
          uv run --frozen --only-group releasenotes \
            python scripts/render_release_notes.py \
            --release-drafter-config .github/release-drafter.yml \
            --output .github/release-drafter-generated.yml

      # yamllint disable-line rule:line-length
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        with:
          config-name: 'file:.github/release-drafter-generated.yml'
