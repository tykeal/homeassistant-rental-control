name: 'CodeQL'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: ['main']
  schedule:
    - cron: '26 16 * * 2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  scan:
    name: 'Audit Repository'
    # Migrated from lfit/releng-reusable-workflows, which is retiring,
    # to the security lane in lfreleng-actions/security-workflows.
    # The rename from reuse-python-codeql.yaml also renamed the config
    # input: 'codeql_config' is now 'config_file'. The lane builds its
    # matrix from the 'languages' input, which defaults to 'python',
    # so this caller keeps the previous single-language behaviour
    # without passing it.
    #
    # Check runs change name with the lane: 'CodeQL Scan: python'
    # becomes 'Analyze (python)', alongside a new 'Validate Workflow
    # Inputs' job. No ruleset or required status check names either,
    # so nothing gating a merge is affected.
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/security-workflows/.github/workflows/codeql.yaml@179b57cc41fbdae90d68237b418539d33e5ba091  # v0.9.4
    with:
      config_file: .github/codeql/codeql-config.yml
    permissions:
      security-events: write  # Upload CodeQL results to code scanning.
      # required to fetch internal or private CodeQL packs
      packages: read  # Fetch internal or private CodeQL packs.
      # only required for workflows in private repositories
      actions: read  # Read workflow metadata (private repos only).
      contents: read  # Check out the repository to analyze.
