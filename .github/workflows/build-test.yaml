---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2021 Andrew Grimberg <tykeal@bardicgrove.org>

# Runs on a new pull request, performs build and runs tests
name: 'Python Build/Test'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'Clear all Python dependency caches'
        type: boolean
        default: false
        required: false
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  repository-metadata:
    name: "Repository Metadata"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: "Gather repository metadata"
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@b2078d32ca207a0e110b2157a95271a35688c8e7  # v0.3.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: 'false'
          artifact_upload: 'true'
          artifact_formats: 'json'

  clear-cache:
    name: 'Clear Python Caches'
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.clear_cache == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    timeout-minutes: 5
    env:
      GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: 'audit'

      - name: 'Clear Python dependency caches'
        env:
          REPO: "${{ github.repository }}"
        run: |
          # Clear Python dependency caches
          echo "Clearing Python dependency caches 🗑️"
          deleted=0
          failed=0
          for prefix in python- setup-python- setup-uv-; do
            while true; do
              if ! keys=$(gh cache list --repo "$REPO" \
                --key "$prefix" --limit 100 \
                --json key --jq '.[].key' 2>&1); then
                echo "::warning::Failed to list caches" \
                  "for prefix '$prefix': $keys"
                echo "Warning: failed to list caches for" \
                  "prefix \`$prefix\`: $keys" \
                  >> "$GITHUB_STEP_SUMMARY"
                failed=1
                break
              fi
              [ -n "$keys" ] || break

              batch_deleted=0
              while IFS= read -r key; do
                [ -n "$key" ] || continue
                if delete_out=$(gh cache delete "$key" \
                  --repo "$REPO" 2>&1); then
                  echo "Deleted cache: $key"
                  deleted=$((deleted + 1))
                  batch_deleted=$((batch_deleted + 1))
                else
                  echo "::warning::Failed to delete" \
                    "cache '$key': $delete_out"
                  echo "Warning: failed to delete cache" \
                    "\`$key\`: $delete_out" \
                    >> "$GITHUB_STEP_SUMMARY"
                  failed=1
                fi
              done <<< "$keys"

              [ "$batch_deleted" -gt 0 ] || break
            done
          done
          if [ "$deleted" -gt 0 ]; then
            echo "Cleared $deleted Python cache(s) ✅" \
              >> "$GITHUB_STEP_SUMMARY"
          elif [ "$failed" -eq 0 ]; then
            echo "No Python caches found to clear 💬" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$failed" -ne 0 ]; then
            echo "Cache clearing completed with errors ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  python-build:
    name: 'Python Build'
    needs: 'clear-cache'
    if: ${{ always() && !cancelled() }}
    runs-on: 'ubuntu-latest'
    outputs:
      matrix_json: "${{ steps.python-build.outputs.matrix_json }}"
      artefact_name: "${{ steps.python-build.outputs.artefact_name }}"
      artefact_path: "${{ steps.python-build.outputs.artefact_path }}"
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 'Build Python project'
        id: python-build
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-build-action@3cdb6f8e3b9c6c8fb21cce123f7b873b3620273d  # v2.1.1

  python-tests:
    name: 'Python Tests'
    runs-on: 'ubuntu-latest'
    needs: 'python-build'
    if: ${{ !cancelled() && needs.python-build.result == 'success' }}
    # Matrix job
    strategy:
      fail-fast: false
      matrix: "${{ fromJson(needs.python-build.outputs.matrix_json) }}"
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: "Python tests [pytest] ${{ matrix.python-version }}"
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-test-action@0c2fe7546faea2321e003c1c3b26a9156a7bc432  # v1.3.1
        with:
          python_version: ${{ matrix.python-version }}
        env:
          # CPython 3.14 strict AST validation breaks pytest assertion
          # rewriting; disable until pytest upstream fixes the issue
          # yamllint disable-line rule:line-length
          PYTEST_ADDOPTS: "${{ startsWith(matrix.python-version, '3.14') && '--assert=plain' || '' }}"

  python-audit:
    name: 'Python Audit'
    runs-on: 'ubuntu-latest'
    needs: 'python-build'
    if: ${{ !cancelled() && needs.python-build.result == 'success' }}
    # Matrix job
    strategy:
      fail-fast: false
      matrix: "${{ fromJson(needs.python-build.outputs.matrix_json) }}"
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: "Audit dependencies ${{ matrix.python-version }}"
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-audit-action@47af793a2a28882b10ceb9109646cbbcecc2e7b0  # v0.6.1
        with:
          python_version: "${{ matrix.python-version }}"
          permit_fail: "${{ vars.NO_BLOCK_AUDIT_FAIL == 'true' }}"
          # pip CVE-2026-3219: concatenated tar/ZIP handling in pip
          # itself (runner tooling, not project dependency)
          ignore_vulns: 'GHSA-58qw-9mgm-455v'

  sbom:
    name: 'Generate SBOM'
    runs-on: ubuntu-latest
    needs: 'python-build'
    if: ${{ !cancelled() && needs.python-build.result == 'success' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: "Generate SBOM"
        id: sbom
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-sbom-action@639001a0def8109e045818dfb3ee82cf602657af  # v0.1.4
        with:
          # The action defaults to 3.12, which cannot satisfy the
          # project floor of >=3.14.2, so uv silently falls back to
          # downloading the newest managed interpreter (3.15.0). No
          # project has published cp315 wheels, so every extension
          # compiled from source (grpcio alone took 13 minutes).
          # Pinning 3.14 keeps uv on the prebuilt cp314 wheels.
          python_version: "3.14"
          include_dev: "false"
          sbom_format: "both"

      - name: "Upload SBOM artifacts"
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-files
          path: |
            sbom-cyclonedx.json
            sbom-cyclonedx.xml
          retention-days: 45

      - name: "SBOM summary"
        run: |
            # SBOM summary
            {
              echo "## SBOM Summary"
              echo "SBOM count: ${{ steps.sbom.outputs.component_count }}"
              echo "Tool used: ${{ steps.sbom.outputs.dependency_manager }}"
            } >> "$GITHUB_STEP_SUMMARY"

  grype:
    name: 'Grype Audit SBOM'
    runs-on: ubuntu-latest
    needs: 'sbom'
    if: ${{ !cancelled() && needs.sbom.result == 'success' }}
    timeout-minutes: 10
    permissions:
      contents: read
      # Read maintainer-approved bypass issues.
      issues: read
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: 'audit'

      # Supplies .github/grype-declared-dependencies.txt, which the
      # scan classifies its findings against.
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: "Download SBOM artefact"
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom-files

      - name: "Grype audit SBOM"
        id: grype-audit
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@7b6b12b60de8ff051f2f8021439c1ef0b82b98c1  # v0.4.0
        with:
          sbom: 'sbom-cyclonedx.json'
          fail-on: 'medium'
          # Our own dependencies gate at 'medium' exactly as before.
          # Packages we merely inherit - almost all of them, since
          # Home Assistant pins its requirements exactly and we cannot
          # bump them from here - are reported as warnings instead.
          # 'none' is deliberate rather than a default taken on trust.
          # 'critical' was tried first, on the theory that a
          # catastrophic advisory is worth stopping a build for, and
          # it immediately gated on five criticals in Home Assistant's
          # pinned pillow and uv. Every one had an upstream fix we
          # cannot reach, so the gate would have been exactly the
          # unactionable red check this change exists to remove. The
          # findings still appear in the summary and the SARIF report.
          dependency-policy: 'declared'
          transitive-fail-on: 'none'
          # The SBOM cannot answer the declared-vs-inherited question:
          # cyclonedx-py scans the environment rather than the project
          # and so emits no 'metadata.component' root, and the action
          # refuses an unrooted graph. An unusable source would leave
          # every finding classified as declared, which gates. Supply
          # the answer directly instead.
          declared-source: 'file'
          # yamllint disable-line rule:line-length
          declared-dependencies: '.github/grype-declared-dependencies.txt'
          cache-db: 'true'
          artifact-name: 'grype-scan-results'
          retention-days: 90
          summary-title: 'Grype Vulnerability Scan'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          permit-fail: ${{ vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
