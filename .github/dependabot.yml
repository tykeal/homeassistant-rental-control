# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A week of cooldown before Dependabot proposes a newly published
    # release. A compromised or broken release is usually yanked or
    # superseded within days, so waiting keeps the automation from
    # being the fastest path into the repository for one.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "Chore"
    open-pull-requests-limit: 15
  # - package-ecosystem: "uv"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   commit-message:
  #     prefix: "Chore"
  #   open-pull-requests-limit: 15
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    # A week of cooldown before Dependabot proposes a newly published
    # release. A compromised or broken release is usually yanked or
    # superseded within days, so waiting keeps the automation from
    # being the fastest path into the repository for one.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "Chore"
    open-pull-requests-limit: 15
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
