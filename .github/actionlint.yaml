# actionlint v1.7.12 is the newest upstream release and its
# concurrency schema predates GitHub's 'queue' key, so it rejects the
# valid 'queue: max' that autolabeler.yaml and any future caller need.
# Drop this file once upstream actionlint learns the key.
paths:
  .github/workflows/**.yaml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
