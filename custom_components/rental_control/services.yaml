checkout:
  target:
    entity:
      integration: rental_control
      domain: sensor
  fields:
    force:
      required: false
      default: false
      selector:
        boolean:

set_state:
  target:
    entity:
      integration: rental_control
      domain: sensor
  fields:
    state:
      required: true
      selector:
        select:
          options:
            - no_reservation
            - awaiting_checkin
            - checked_in
            - checked_out

clear_orphaned_codes:
  fields:
    dry_run:
      required: false
      default: false
      selector:
        boolean:
    force_reissued_holds:
      required: false
      default: false
      selector:
        boolean:

force_reissue:
  fields:
    entity_id:
      required: false
      selector:
        entity:
          integration: rental_control
          domain: sensor
    lockname:
      required: false
      selector:
        text:
    slot:
      required: false
      selector:
        number:
          min: 1
          mode: box
    force:
      required: false
      default: false
      selector:
        boolean:
    dry_run:
      required: false
      default: false
      selector:
        boolean:
